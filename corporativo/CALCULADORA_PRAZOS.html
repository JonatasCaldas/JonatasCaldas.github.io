<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculis | Calculadora de Prazos</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = { theme: { extend: { colors: { accent: '#6FE6FC', 'accent-dark': '#5ACCE0' } } } };
  </script>
  <style>
    body { background:#f8fafc; font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif; }
    ::-webkit-scrollbar{width:6px;height:6px} ::-webkit-scrollbar-track{background:#f1f5f9} ::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:3px}
    @keyframes fadeIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}} .animate-fade-in{animation:fadeIn .25s ease-out forwards}
    .timeline-event{border-left:6px solid #00ADB5;transition:transform .15s ease,box-shadow .15s ease}.timeline-event.grupo-externo{border-left-color:#00ADB5;box-shadow:0 3px 10px rgba(0,173,181,.16)}
    .timeline-event.grupo-ecs{border-left-color:#7C3AED}.timeline-event.etapa-especial{border-right:6px solid #F59E0B;background:linear-gradient(90deg,#fff 0%,#fff8e6 100%)}
    .timeline-event.selecionada{border-left-color:#111827;background:#e9fbfc;font-weight:700;transform:translateX(4px);box-shadow:0 8px 18px rgba(15,23,42,.14)}
    .timeline-event.selecionada.etapa-especial{background:linear-gradient(90deg,#e9fbfc 0%,#fff3ce 100%)}
  </style>
</head>
<body class="text-gray-800 antialiased min-h-screen">
<div class="flex min-h-screen w-full">
  <div id="sidebar-overlay" class="fixed inset-0 z-20 bg-gray-900/50 hidden md:hidden" aria-hidden="true"></div>
  <aside id="sidebar" aria-label="Navegação principal" class="bg-white border-r border-gray-200 w-64 fixed inset-y-0 left-0 z-30 -translate-x-full transition-transform duration-300 md:relative md:translate-x-0 md:flex-shrink-0 shadow-sm flex flex-col">
    <div class="p-6 border-b border-gray-100">
      <div class="flex items-start justify-between gap-3">
        <div><h1 class="text-2xl font-bold text-gray-900 tracking-tight">Calculis</h1><p class="text-xs text-gray-500 font-medium mt-1">Calculadora de Prazos</p></div>
        <button id="close-sidebar-btn" type="button" aria-label="Fechar menu" class="md:hidden text-gray-400 hover:text-gray-700"><i data-lucide="x"></i></button>
      </div>
    </div>
    <nav class="p-4 flex-1 overflow-y-auto">
      <h2 class="text-xs font-bold uppercase text-gray-400 tracking-wider mb-3 px-3">Navegação</h2>
      <ul class="space-y-1">
        <li><button data-view="calculadora" class="nav-link w-full flex items-center gap-3 px-3 py-2 rounded-md text-sm font-semibold"><i data-lucide="calculator" class="w-4 h-4"></i>Calculadora</button></li>
        <li><button data-view="configuracoes" class="nav-link w-full flex items-center gap-3 px-3 py-2 rounded-md text-sm font-semibold"><i data-lucide="settings" class="w-4 h-4"></i>Configurações</button></li>
      </ul>
    </nav>
    <footer class="px-5 py-4 border-t border-gray-100 bg-gray-50 text-center"><p class="text-[11px] text-gray-500 font-medium">Planejamento e acompanhamento de prazos</p></footer>
  </aside>

  <div class="flex-1 flex flex-col min-w-0">
    <header class="bg-white border-b border-gray-200 sticky top-0 z-20 md:hidden">
      <div class="flex items-center justify-between h-16 px-4"><button id="open-sidebar-btn" type="button" aria-label="Abrir menu" aria-controls="sidebar" aria-expanded="false" class="text-gray-600"><i data-lucide="menu"></i></button><span class="font-bold text-gray-900 text-lg">Calculis | Calculadora de Prazos</span><div class="w-6"></div></div>
    </header>
    <main class="flex-1 p-6 md:p-10 max-w-none w-full mx-auto"><div id="main-content" class="animate-fade-in"></div></main>
  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
  const etapas = [
    {nome:'Elaboração do ECS (Doc. Completa) - Iniciar ECS',duracao:7},{nome:'Elaboração do ECS (Doc. Completa) - Entregar Projeto Básico',duracao:12},
    {nome:'Elaboração do ECS (Doc. Completa) - Contrato Modelado',duracao:17},{nome:'Elaboração do ECS (Doc. Completa) - Solicitar SIEC',duracao:30},
    {nome:'Elaboração do ECS (Doc. Completa) - Preparar para RAV',duracao:10},{nome:'Valoração',duracao:30},{nome:'Finalização do ECS (Doc. Completa)',duracao:11},
    {nome:'Emissão e Aprovação da SC',duracao:3},{nome:'Instaurar Processo',duracao:2},{nome:'Elaborar Edital',duracao:10},{nome:'Reserva de Verba',duracao:4},
    {nome:'Chancelar Edital',duracao:13},{nome:'Aprovar Edital em RD',duracao:3},{nome:'Publicar Edital',duracao:3},{nome:'Prazo mínimo para abertura da sessão',duracao:3},
    {nome:'Sessão Pública Eletrônica',duracao:7},{nome:'Homologar resultado final em RD',duracao:5},{nome:'Assinatura do Contrato',duracao:10},{nome:'Desembolso',duracao:30}
  ];
  const duracoesPadrao=Object.freeze(etapas.map(e=>e.duracao)),duracaoMaxima=365,chavePreferencias='calculis-preferencias';
  let activeView='calculadora', calculoRealizado=false, ultimoCalculo=null, alteracoesPendentes=false, duracoesAnteriores=null;
  function carregarPreferencias(){try{const dados=JSON.parse(localStorage.getItem(chavePreferencias));if(Array.isArray(dados?.duracoes)&&dados.duracoes.length===etapas.length&&dados.duracoes.every(v=>Number.isInteger(v)&&v>=0&&v<=duracaoMaxima))dados.duracoes.forEach((v,i)=>etapas[i].duracao=v);if(dados?.ultimoCalculo&&typeof dados.ultimoCalculo.dataTexto==='string'&&Number.isInteger(dados.ultimoCalculo.indice)&&dados.ultimoCalculo.indice>=0&&dados.ultimoCalculo.indice<etapas.length){ultimoCalculo=dados.ultimoCalculo;calculoRealizado=Boolean(lerDataBrasileira(ultimoCalculo.dataTexto))}}catch(e){localStorage.removeItem(chavePreferencias)}}
  function salvarPreferencias(){localStorage.setItem(chavePreferencias,JSON.stringify({duracoes:etapas.map(e=>e.duracao),ultimoCalculo}))}
  carregarPreferencias();
  const main=document.getElementById('main-content'),sidebar=document.getElementById('sidebar'),sidebarOverlay=document.getElementById('sidebar-overlay'),openSidebarBtn=document.getElementById('open-sidebar-btn'),closeSidebarBtn=document.getElementById('close-sidebar-btn');
  const inputClass='block w-full text-sm border-gray-300 rounded-md shadow-sm focus:border-accent focus:ring-accent p-2.5 border bg-white';

  function formatarEntradaData(valor){
    const numeros=valor.replace(/\D/g,'').slice(0,8);
    if(numeros.length<=2)return numeros;
    if(numeros.length<=4)return `${numeros.slice(0,2)}/${numeros.slice(2)}`;
    return `${numeros.slice(0,2)}/${numeros.slice(2,4)}/${numeros.slice(4)}`;
  }
  function lerDataBrasileira(valor){
    const numeros=valor.replace(/\D/g,'');
    if(numeros.length!==8)return null;
    const d=Number(numeros.slice(0,2)),mes=Number(numeros.slice(2,4)),a=Number(numeros.slice(4,8));
    const data=new Date(a,mes-1,d,12);
    return data.getFullYear()===a&&data.getMonth()===mes-1&&data.getDate()===d?data:null;
  }
  function adicionarDias(data,qtd){const r=new Date(data);r.setDate(r.getDate()+qtd);return r}
  function formatarData(data){return data.toLocaleDateString('pt-BR')}
  function calcularOffsets(){const o=[0];for(let i=1;i<etapas.length;i++)o[i]=o[i-1]+etapas[i].duracao;return o}
  function faseEtapa(i){return i<7?'ECS':i<17?'Licitação':'Contratação'}
  function opcoesEtapas(filtro=''){const termo=filtro.trim().toLocaleLowerCase('pt-BR');return ['ECS','Licitação','Contratação'].map(fase=>{const opcoes=etapas.map((e,i)=>({e,i})).filter(({e,i})=>faseEtapa(i)===fase&&(!termo||String(i+1).includes(termo)||e.nome.toLocaleLowerCase('pt-BR').includes(termo))).map(({e,i})=>`<button type="button" role="option" data-indice="${i}" class="w-full px-3 py-2 text-left hover:bg-cyan-50 focus:bg-cyan-50 focus:outline-none"><span class="block text-sm text-gray-800"><b class="text-gray-400 mr-1">${i+1}.</b>${e.nome}</span><span class="block text-xs text-gray-500 mt-0.5">${e.duracao} dias</span></button>`).join('');return opcoes?`<div><div class="px-3 py-2 text-xs font-bold uppercase tracking-wider text-gray-400 bg-gray-50">${fase}</div>${opcoes}</div>`:''}).join('')||'<p class="p-3 text-sm text-gray-500">Nenhuma etapa encontrada.</p>'}

  function renderCalculadora(){
    main.innerHTML=`<section class="space-y-6"><div class="border-l-4 border-accent pl-3"><h2 class="text-2xl font-semibold text-gray-900">Calculadora de Prazos</h2><p class="text-sm text-gray-500 mt-1">Informe uma data de referência e a etapa correspondente.</p><p class="text-xs text-gray-600 mt-2 flex items-start gap-2"><i data-lucide="calendar-days" class="w-4 h-4 shrink-0 text-amber-600"></i>Cálculo realizado em dias corridos, incluindo sábados, domingos e feriados.</p>${etapas.some((e,i)=>e.duracao!==duracoesPadrao[i])?'<p class="text-xs font-semibold text-amber-700 mt-2">Valores personalizados ativos neste dispositivo.</p>':''}</div>
    <div class="grid grid-cols-1 xl:grid-cols-[minmax(300px,0.8fr)_minmax(520px,1.5fr)] gap-6 items-start">
      <form id="form-calculo" class="bg-white p-6 rounded-lg shadow-sm border border-gray-100 xl:sticky xl:top-8 space-y-5">
        <div><label for="dataInput" class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">Data conhecida</label><p id="ajuda-data" class="text-xs text-gray-500 mb-2">Informe uma data já definida no processo.</p><input id="dataInput" value="${ultimoCalculo?.dataTexto||''}" placeholder="dd/mm/aaaa" inputmode="numeric" maxlength="10" autocomplete="off" class="${inputClass}" aria-describedby="ajuda-data mensagem-data" required><p id="mensagem-data" class="text-sm font-semibold text-red-700 mt-2" aria-live="polite"></p></div>
        <div><label for="buscaEtapa" class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">A qual etapa essa data pertence?</label><div id="comboboxEtapa" class="relative"><input id="buscaEtapa" role="combobox" aria-expanded="false" aria-controls="listaEtapas" aria-autocomplete="list" autocomplete="off" placeholder="Selecione uma etapa" value="${ultimoCalculo?`${ultimoCalculo.indice+1}. ${etapas[ultimoCalculo.indice].nome}`:''}" class="${inputClass} pr-10"><input id="etapaSelecionada" type="hidden" value="${ultimoCalculo?.indice??''}"><i data-lucide="chevrons-up-down" class="w-4 h-4 absolute right-3 top-3 text-gray-400 pointer-events-none"></i><div id="listaEtapas" role="listbox" class="hidden absolute z-10 mt-1 w-full max-h-72 overflow-y-auto bg-white border border-gray-200 rounded-md shadow-lg">${opcoesEtapas()}</div></div></div>
        <button id="calcular" disabled class="w-full px-5 py-2.5 bg-accent hover:bg-accent-dark disabled:bg-gray-200 disabled:text-gray-400 disabled:cursor-not-allowed text-gray-900 font-bold rounded-md text-sm transition shadow-sm flex justify-center items-center gap-2"><i data-lucide="calculator" class="w-4 h-4"></i>Calcular</button>
        <div id="mensagem" class="text-sm font-semibold" role="status" aria-live="polite"></div>
        <details class="border border-gray-200 rounded-md overflow-hidden">
          <summary class="p-4 bg-gray-50 cursor-pointer select-none flex items-center justify-between gap-3 text-sm font-semibold text-gray-800"><span class="flex items-center gap-2"><i data-lucide="sliders-horizontal" class="w-4 h-4"></i>Ajustar duração das etapas</span><span class="text-xs font-medium text-gray-500">${etapas.length} etapas • ${etapas.reduce((total,e)=>total+e.duracao,0)} dias</span></summary>
          <div class="max-h-96 overflow-y-auto divide-y divide-gray-100">${etapas.map((e,i)=>`<div class="p-3 grid grid-cols-[minmax(0,1fr)_84px] gap-3 items-center ${e.duracao!==duracoesPadrao[i]?'bg-amber-50':''}"><label for="duracao-${i}" class="text-xs text-gray-700"><b class="text-gray-400 mr-1">${i+1}.</b>${e.nome}</label><input id="duracao-${i}" type="number" min="0" max="${duracaoMaxima}" step="1" value="${e.duracao}" class="${inputClass} text-right" aria-label="Duração da etapa ${i+1}">${e.duracao!==duracoesPadrao[i]?'<span class="col-span-2 text-[11px] font-semibold text-amber-700">Diferente do padrão</span>':''}</div>`).join('')}</div>
          <div class="p-4 bg-gray-50 border-t border-gray-200 space-y-3"><p id="config-mensagem" class="text-xs text-gray-500">Use 0 para eliminar o intervalo da etapa. Máximo: ${duracaoMaxima} dias.</p><button id="aplicar" type="button" disabled class="disabled:bg-gray-100 disabled:text-gray-400 disabled:cursor-not-allowed w-full px-4 py-2 bg-white hover:bg-gray-100 border border-gray-300 text-gray-800 font-bold rounded-md text-sm transition">Aplicar durações</button></div>
        </details>
      </form>
      <section><div class="flex flex-wrap gap-4 mb-4 text-xs font-semibold text-gray-500"><span><b class="inline-block w-2.5 h-2.5 rounded-full bg-violet-600 mr-1"></b>Execução Interna</span><span><b class="inline-block w-2.5 h-2.5 rounded-full bg-[#00ADB5] mr-1"></b>Execução Externa</span><span><b class="inline-block w-2.5 h-2.5 rounded-full bg-amber-500 mr-1"></b>Execução Terceirizada</span></div><div id="timeline" class="space-y-3"></div></section>
    </div></section>`;
    const campoData=document.getElementById('dataInput'),mensagemData=document.getElementById('mensagem-data'),botaoCalcular=document.getElementById('calcular');
    function atualizarBotao(){botaoCalcular.disabled=!lerDataBrasileira(campoData.value)||document.getElementById('etapaSelecionada').value===''}
    function validarData(forcar=false){const completa=campoData.value.replace(/\D/g,'').length===8,invalida=Boolean((completa||forcar)&&campoData.value&&!lerDataBrasileira(campoData.value));campoData.setAttribute('aria-invalid',String(invalida));campoData.classList.toggle('border-red-500',invalida);campoData.classList.toggle('focus:border-red-500',invalida);campoData.classList.toggle('focus:ring-red-500',invalida);mensagemData.textContent=invalida?`${campoData.value} não é uma data válida.`:'';atualizarBotao()}
    campoData.addEventListener('input',e=>{
      const inicio=e.target.selectionStart;
      const tamanhoAnterior=e.target.value.length;
      e.target.value=formatarEntradaData(e.target.value);
      const diferenca=e.target.value.length-tamanhoAnterior;
      const novaPosicao=Math.max(0,(inicio??e.target.value.length)+diferenca);
      e.target.setSelectionRange(novaPosicao,novaPosicao);
      validarData();
    });
    campoData.addEventListener('blur',()=>validarData(true));
    campoData.addEventListener('paste',e=>{
      e.preventDefault();
      campoData.value=formatarEntradaData(e.clipboardData.getData('text'));
      campoData.dispatchEvent(new Event('input',{bubbles:true}));
    });
    const buscaEtapa=document.getElementById('buscaEtapa'),listaEtapas=document.getElementById('listaEtapas'),etapaSelecionada=document.getElementById('etapaSelecionada');
    function abrirLista(){listaEtapas.classList.remove('hidden');buscaEtapa.setAttribute('aria-expanded','true')}
    function fecharLista(){listaEtapas.classList.add('hidden');buscaEtapa.setAttribute('aria-expanded','false')}
    function vincularOpcoes(){listaEtapas.querySelectorAll('[data-indice]').forEach(opcao=>opcao.addEventListener('click',()=>{const indice=Number(opcao.dataset.indice);etapaSelecionada.value=indice;buscaEtapa.value=`${indice+1}. ${etapas[indice].nome}`;fecharLista();atualizarBotao()}))}
    buscaEtapa.addEventListener('focus',abrirLista);buscaEtapa.addEventListener('click',abrirLista);
    buscaEtapa.addEventListener('input',()=>{etapaSelecionada.value='';listaEtapas.innerHTML=opcoesEtapas(buscaEtapa.value);vincularOpcoes();abrirLista();atualizarBotao()});
    buscaEtapa.addEventListener('keydown',e=>{if(e.key==='Escape')fecharLista();if(e.key==='ArrowDown'){e.preventDefault();abrirLista();listaEtapas.querySelector('[data-indice]')?.focus()}});
    listaEtapas.addEventListener('keydown',e=>{if(e.key==='Escape'){fecharLista();buscaEtapa.focus()}if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();const opcoes=[...listaEtapas.querySelectorAll('[data-indice]')],indice=opcoes.indexOf(document.activeElement),proximo=e.key==='ArrowDown'?Math.min(indice+1,opcoes.length-1):Math.max(indice-1,0);opcoes[proximo]?.focus()}});
    document.addEventListener('click',e=>{if(!document.getElementById('comboboxEtapa').contains(e.target))fecharLista()});vincularOpcoes();validarData();
    document.getElementById('form-calculo').addEventListener('submit',e=>{e.preventDefault();executarCalculo()});
    document.querySelectorAll('[id^="duracao-"]').forEach(input=>input.addEventListener('input',atualizarAlteracoesPendentes));
    document.getElementById('aplicar').addEventListener('click',aplicarAlteracoes);
    if(calculoRealizado) executarCalculo(true); else renderEtapasSemDatas();
    lucide.createIcons();
  }
  function renderEtapasSemDatas(){document.getElementById('timeline').innerHTML=`<div class="bg-white rounded-lg shadow-sm border border-gray-100 p-8 text-center"><div class="w-12 h-12 mx-auto rounded-full bg-cyan-50 text-cyan-700 flex items-center justify-center"><i data-lucide="calendar-clock" class="w-6 h-6"></i></div><h3 class="text-lg font-semibold text-gray-900 mt-4">Seu cronograma aparecerá aqui</h3><p class="text-sm text-gray-600 mt-2">Informe uma data, selecione a etapa correspondente e clique em Calcular.</p><p class="text-xs font-medium text-gray-500 mt-4">O cálculo considera ${etapas.length} etapas em dias corridos.</p></div>`;lucide.createIcons()}
  function cardEtapa(etapa,i,data,selecionado){const classes=['timeline-event','bg-white','p-4','rounded-lg','shadow-sm','border','border-gray-100'],interna=i<7,especial=i===3||i===5;if(interna)classes.push('grupo-ecs');else classes.push('grupo-externo');if(especial)classes.push('etapa-especial');if(i===selecionado)classes.push('selecionada');return `<article class="${classes.join(' ')}"><div class="flex items-start justify-between gap-4"><div><div class="flex flex-wrap items-center gap-2"><span class="text-xs font-bold text-gray-400 uppercase">Etapa ${i+1}</span><span class="px-2 py-0.5 rounded-full text-[11px] font-semibold ${interna?'bg-violet-100 text-violet-800':'bg-cyan-100 text-cyan-800'}">${interna?'Execução interna':'Execução externa'}</span>${especial?'<span class="px-2 py-0.5 rounded-full text-[11px] font-semibold bg-amber-100 text-amber-800">Etapa especial</span>':''}${i===selecionado?'<span class="px-2 py-0.5 rounded-full text-[11px] font-semibold bg-gray-900 text-white">Data informada pelo usuário</span>':''}</div><h3 class="text-sm text-gray-800 mt-2">${etapa.nome}</h3></div><div class="text-right shrink-0">${data?`<div class="font-bold text-gray-900">${formatarData(data)}</div>`:''}<div class="text-xs text-gray-500 mt-1">${etapa.duracao} dias</div></div></div></article>`}
  function executarCalculo(silencioso=false){const dataTexto=document.getElementById('dataInput').value, data=lerDataBrasileira(dataTexto), valorEtapa=document.getElementById('etapaSelecionada').value, indice=Number(valorEtapa), msg=document.getElementById('mensagem');msg.textContent='';if(!data){msg.textContent='Informe uma data válida no formato dd/mm/aaaa.';return}if(valorEtapa===''){msg.textContent='Selecione a etapa correspondente à data informada.';return}calculoRealizado=true;ultimoCalculo={dataTexto,indice};salvarPreferencias();const offsets=calcularOffsets(),base=offsets[indice],datas=etapas.map((_,i)=>adicionarDias(data,offsets[i]-base)),duracaoTotal=offsets[etapas.length-1];document.getElementById('timeline').innerHTML=`<section class="bg-white rounded-lg shadow-sm border border-gray-100 p-5 space-y-4"><div><h3 class="text-lg font-semibold text-gray-900">Resumo do cronograma</h3><p class="text-sm text-gray-500 mt-1">Etapa de referência: <b class="text-gray-700">${indice+1}. ${etapas[indice].nome}</b></p></div><div class="grid grid-cols-1 sm:grid-cols-3 gap-3"><div class="p-3 rounded-md bg-gray-50"><span class="block text-xs font-bold uppercase tracking-wider text-gray-400">Início estimado</span><strong class="block text-gray-900 mt-1">${formatarData(datas[0])}</strong></div><div class="p-3 rounded-md bg-gray-50"><span class="block text-xs font-bold uppercase tracking-wider text-gray-400">Final estimado</span><strong class="block text-gray-900 mt-1">${formatarData(datas[datas.length-1])}</strong></div><div class="p-3 rounded-md bg-gray-50"><span class="block text-xs font-bold uppercase tracking-wider text-gray-400">Duração total</span><strong class="block text-gray-900 mt-1">${duracaoTotal} dias corridos</strong></div></div><p class="text-xs text-amber-700 flex items-start gap-2"><i data-lucide="info" class="w-4 h-4 shrink-0"></i>Cálculo realizado em dias corridos, incluindo sábados, domingos e feriados.</p></section>${etapas.map((e,i)=>`${i===0||faseEtapa(i)!==faseEtapa(i-1)?`<div class="pt-3 first:pt-0"><h3 class="text-xs font-bold uppercase tracking-wider text-gray-500 flex items-center gap-2"><span class="h-px flex-1 bg-gray-200"></span>${faseEtapa(i)}<span class="h-px flex-1 bg-gray-200"></span></h3></div>`:''}${cardEtapa(e,i,datas[i],indice)}`).join('')}`;lucide.createIcons();if(!silencioso){msg.className='text-sm font-semibold text-green-700';msg.textContent='Cronograma calculado com sucesso';const botao=document.getElementById('calcular'),conteudo=botao.innerHTML;botao.innerHTML='<i data-lucide="check" class="w-4 h-4"></i>Cronograma atualizado';lucide.createIcons();setTimeout(()=>{if(document.body.contains(botao)){botao.innerHTML=conteudo;lucide.createIcons()}},1800);if(innerWidth<768)document.getElementById('timeline').scrollIntoView({behavior:'smooth',block:'start'})}}

  function renderConfiguracoes(){main.innerHTML=`<section class="space-y-6"><div class="border-l-4 border-accent pl-3"><h2 class="text-2xl font-semibold text-gray-900">Configurações</h2><p class="text-sm text-gray-500 mt-1">Altere as durações. Os valores salvos permanecem neste dispositivo entre sessões.</p>${etapas.some((e,i)=>e.duracao!==duracoesPadrao[i])?'<p class="text-xs font-semibold text-amber-700 mt-2">Valores personalizados ativos.</p>':''}</div></div>
    <div class="bg-white rounded-lg shadow-sm border border-gray-100 overflow-hidden"><div class="p-5 bg-gray-50 border-b border-gray-200 flex items-center justify-between gap-4"><div><h3 class="font-semibold text-gray-800">Duração das etapas</h3><p class="text-xs text-gray-500 mt-1">Cálculo realizado em dias corridos, incluindo sábados, domingos e feriados. Use 0 para eliminar o intervalo; máximo de ${duracaoMaxima} dias por etapa.</p></div><span class="text-xs font-bold text-gray-400">19 ETAPAS</span></div>
    <div class="divide-y divide-gray-100">${etapas.map((e,i)=>`<div class="p-4 grid grid-cols-[minmax(0,1fr)_100px] gap-4 items-center ${e.duracao!==duracoesPadrao[i]?'bg-amber-50':''}"><label for="duracao-${i}" class="text-sm text-gray-700"><b class="text-gray-400 mr-2">${i+1}.</b>${e.nome}</label><div><label class="sr-only" for="duracao-${i}">Duração da etapa ${i+1}</label><input id="duracao-${i}" type="number" min="0" max="${duracaoMaxima}" step="1" value="${e.duracao}" class="${inputClass} text-right" aria-label="Duração da etapa ${i+1}">${e.duracao!==duracoesPadrao[i]?'<span class="block text-[11px] font-semibold text-amber-700 mt-1">Diferente do padrão</span>':''}</div></div>`).join('')}</div>
    <div class="p-5 bg-gray-50 border-t border-gray-200 space-y-3"><div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3"><p id="config-mensagem" class="text-sm text-gray-500">${calculoRealizado?'As alterações recalcularão automaticamente as datas.':'As configurações serão usadas no próximo cálculo.'}</p><button id="aplicar" disabled class="disabled:bg-gray-200 disabled:text-gray-400 disabled:cursor-not-allowed px-5 py-2.5 bg-accent hover:bg-accent-dark text-gray-900 font-bold rounded-md text-sm transition shadow-sm">${calculoRealizado?'Salvar e recalcular':'Salvar configurações'}</button></div><button id="restaurar-padrao" type="button" class="text-sm font-semibold text-gray-600 hover:text-gray-900">Restaurar padrão</button></div></div></section>`;
    document.querySelectorAll('[id^="duracao-"]').forEach(input=>input.addEventListener('input',atualizarAlteracoesPendentes));
    document.getElementById('aplicar').addEventListener('click',aplicarAlteracoes);document.getElementById('restaurar-padrao').addEventListener('click',restaurarDuracoesPadrao);lucide.createIcons();
  }
  function atualizarAlteracoesPendentes(){const msg=document.getElementById('config-mensagem'),botao=document.getElementById('aplicar'),valores=etapas.map((_,i)=>document.getElementById(`duracao-${i}`).value),validos=valores.every(v=>Number.isInteger(Number(v))&&Number(v)>=0&&Number(v)<=duracaoMaxima),modificados=valores.some((v,i)=>Number(v)!==etapas[i].duracao),atipicos=valores.map(Number).filter((v,i)=>v>Math.max(30,duracoesPadrao[i]*3));alteracoesPendentes=modificados;botao.disabled=!modificados||!validos;msg.className=`${activeView==='calculadora'?'text-xs':'text-sm'} ${modificados?'text-amber-700 font-semibold':'text-gray-500'}`;msg.textContent=!validos?'Informe valores inteiros entre 0 e 365 dias.':atipicos.length?`Alterações não aplicadas. ${atipicos.length===1?'Esta duração é':'Estas durações são'} muito superior${atipicos.length===1?'':'es'} ao padrão. Confirme antes de salvar.`:modificados?'Alterações não aplicadas':calculoRealizado?'As alterações recalcularão automaticamente as datas.':'As configurações serão usadas no próximo cálculo.'}
  function aplicarAlteracoes(){const msg=document.getElementById('config-mensagem'),novos=etapas.map((_,i)=>Number(document.getElementById(`duracao-${i}`).value));if(novos.some(v=>!Number.isInteger(v)||v<0||v>duracaoMaxima)){msg.className='text-sm text-red-700 font-semibold';msg.textContent=`Informe durações inteiras entre 0 e ${duracaoMaxima} dias.`;return}const atipicos=novos.map((v,i)=>({v,i})).filter(({v,i})=>v>Math.max(30,duracoesPadrao[i]*3));if(atipicos.length&&!confirm(`${atipicos.map(({v,i})=>`Etapa ${i+1}: ${v} dias (padrão: ${duracoesPadrao[i]} dias)`).join('\n')}\n\nOs valores são muito superiores ao padrão. Deseja salvar mesmo assim?`))return;duracoesAnteriores=etapas.map(e=>e.duracao);novos.forEach((v,i)=>etapas[i].duracao=v);salvarPreferencias();alteracoesPendentes=false;document.getElementById('aplicar').disabled=true;msg.className='text-sm text-green-700 font-semibold';msg.innerHTML=`Configurações salvas${calculoRealizado?'. O cronograma foi recalculado.':'.'}${activeView==='configuracoes'?`<span class="flex flex-wrap gap-3 mt-3"><button id="desfazer-alteracao" type="button" class="px-4 py-2 bg-white hover:bg-gray-100 border border-gray-300 text-gray-700 font-semibold rounded-md text-sm transition">Desfazer última alteração</button><button id="ver-cronograma" type="button" class="px-4 py-2 bg-accent hover:bg-accent-dark text-gray-900 font-bold rounded-md text-sm transition">Ver cronograma recalculado</button><button id="continuar-editando" type="button" class="px-4 py-2 bg-white hover:bg-gray-100 border border-gray-300 text-gray-700 font-semibold rounded-md text-sm transition">Continuar editando</button></span>`:''}`;if(activeView==='calculadora'){if(calculoRealizado)executarCalculo(true);document.querySelector('details summary span:last-child').textContent=`${etapas.length} etapas • ${etapas.reduce((total,e)=>total+e.duracao,0)} dias`;return}document.getElementById('desfazer-alteracao').addEventListener('click',desfazerUltimaAlteracao);document.getElementById('ver-cronograma').addEventListener('click',()=>navigateTo('calculadora'));document.getElementById('continuar-editando').addEventListener('click',()=>document.getElementById('duracao-0').focus())}

  function preencherDuracoes(valores){valores.forEach((v,i)=>document.getElementById(`duracao-${i}`).value=v);atualizarAlteracoesPendentes()}
  function restaurarDuracoesPadrao(){if(confirm('Restaurar as 19 durações padrão?'))preencherDuracoes(duracoesPadrao)}
  function desfazerUltimaAlteracao(){if(!duracoesAnteriores)return;const atuais=etapas.map(e=>e.duracao);duracoesAnteriores.forEach((v,i)=>etapas[i].duracao=v);salvarPreferencias();duracoesAnteriores=atuais;alteracoesPendentes=false;renderConfiguracoes()}
  function updateNav(){document.querySelectorAll('.nav-link').forEach(b=>{const ativo=b.dataset.view===activeView;b.className=`nav-link w-full flex items-center gap-3 px-3 py-2 rounded-md text-sm font-semibold transition ${ativo?'bg-accent text-gray-900 shadow-sm':'text-gray-600 hover:bg-gray-100 hover:text-gray-900'}`})}
  function navigateTo(view){if(view!==activeView&&alteracoesPendentes&&!confirm('Existem alterações não aplicadas. Deseja sair sem salvar?'))return;alteracoesPendentes=false;activeView=view;main.classList.remove('animate-fade-in');void main.offsetWidth;main.classList.add('animate-fade-in');view==='configuracoes'?renderConfiguracoes():renderCalculadora();updateNav();if(innerWidth<768)fecharSidebar(false)}
  document.querySelectorAll('.nav-link').forEach(b=>b.addEventListener('click',()=>navigateTo(b.dataset.view)));
  function abrirSidebar(){sidebar.classList.remove('-translate-x-full');sidebarOverlay.classList.remove('hidden');document.body.classList.add('overflow-hidden');openSidebarBtn.setAttribute('aria-expanded','true');closeSidebarBtn.focus()}
  function fecharSidebar(devolverFoco=true){sidebar.classList.add('-translate-x-full');sidebarOverlay.classList.add('hidden');document.body.classList.remove('overflow-hidden');openSidebarBtn.setAttribute('aria-expanded','false');if(devolverFoco)openSidebarBtn.focus()}
  openSidebarBtn.addEventListener('click',abrirSidebar);
  closeSidebarBtn.addEventListener('click',()=>fecharSidebar());
  sidebarOverlay.addEventListener('click',()=>fecharSidebar());
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&openSidebarBtn.getAttribute('aria-expanded')==='true')fecharSidebar()});
  window.addEventListener('beforeunload',e=>{if(alteracoesPendentes){e.preventDefault();e.returnValue=''}});
  navigateTo('calculadora');
});
</script>
</body>
</html>
