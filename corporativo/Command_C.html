<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Command + C</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config={theme:{extend:{colors:{ink:'#172033',brand:'#2563eb',surface:'#f5f7fb'}}}}
  </script>
  <style>
    *{scrollbar-width:thin;scrollbar-color:#cbd5e1 transparent}.view{display:none}.view.active{display:block}
    .nav-btn.active{background:#eff6ff;color:#1d4ed8}.drop-active{border-color:#2563eb;background:#eff6ff}
    .fade{animation:fade .2s ease-out}@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
    @media print{aside,header,.no-print{display:none!important}main{margin:0!important;padding:0!important}.view{display:none!important}#view-report{display:block!important}}
  </style>
</head>
<body class="bg-surface text-slate-800 min-h-screen">
<div class="flex min-h-screen">
  <aside class="hidden lg:flex w-64 bg-white border-r border-slate-200 fixed inset-y-0 z-30 flex-col">
    <div class="h-20 px-6 flex items-center border-b border-slate-100">
      <div class="w-10 h-10 rounded-xl bg-blue-600 text-white grid place-items-center"><i data-lucide="radar"></i></div>
      <div class="ml-3"><strong class="block text-ink">Command + C</strong><span class="text-xs text-slate-500">Gestão de demandas</span></div>
    </div>
    <nav id="sideNav" class="p-3 space-y-1 flex-1"></nav>
    <div class="p-4 border-t text-xs text-slate-500">Os dados ficam somente neste navegador.</div>
  </aside>
  <div class="flex-1 lg:ml-64 min-w-0">
    <header class="h-20 bg-white/90 backdrop-blur border-b sticky top-0 z-20 px-4 md:px-8 flex items-center justify-between">
      <div class="flex items-center gap-3"><button id="mobileMenu" class="lg:hidden p-2 rounded-lg hover:bg-slate-100" aria-label="Abrir menu"><i data-lucide="menu"></i></button><div><h1 id="pageTitle" class="font-bold text-xl text-ink">Visão geral</h1><p id="pageSubtitle" class="text-xs text-slate-500">Visão consolidada das equipes</p></div></div>
      <div class="flex items-center gap-2"><button data-go="data" class="px-3 py-2 rounded-lg border text-sm hover:bg-slate-50 flex items-center gap-2"><i data-lucide="upload" class="w-4"></i><span class="hidden sm:inline">Importar CSV</span></button><button id="quickBackup" class="px-3 py-2 rounded-lg bg-ink text-white text-sm flex items-center gap-2"><i data-lucide="download" class="w-4"></i><span class="hidden sm:inline">Backup</span></button></div>
    </header>
    <div id="mobileNav" class="hidden lg:hidden fixed inset-0 z-40 bg-black/30"><div class="bg-white w-72 h-full p-4"><div class="flex justify-between mb-5"><strong>Menu</strong><button id="closeMenu"><i data-lucide="x"></i></button></div><nav id="mobileNavItems" class="space-y-1"></nav></div></div>
    <main class="p-4 md:p-8 max-w-[1600px] mx-auto">
      <section id="view-dashboard" class="view active fade"></section>
      <section id="view-meeting" class="view fade"></section>
      <section id="view-demands" class="view fade"></section>
      <section id="view-actions" class="view fade"></section>
      <section id="view-bottlenecks" class="view fade"></section>
      <section id="view-report" class="view fade"></section>
      <section id="view-data" class="view fade"></section>
    </main>
  </div>
</div>
<div id="toast" class="fixed bottom-5 right-5 z-50 hidden px-4 py-3 rounded-xl bg-ink text-white shadow-xl text-sm"></div>
<div id="modal" class="fixed inset-0 z-50 hidden bg-black/40 p-4 items-center justify-center"><div class="bg-white rounded-2xl max-w-xl w-full shadow-2xl"><div class="p-5 border-b flex justify-between"><h2 id="modalTitle" class="font-bold"></h2><button onclick="closeModal()"><i data-lucide="x"></i></button></div><form id="modalForm" class="p-5 space-y-4"></form></div></div>
<div id="detailModal" class="fixed inset-0 z-50 hidden bg-black/40 p-4 items-center justify-center" role="dialog" aria-modal="true" aria-labelledby="detailTitle"><div class="bg-white rounded-2xl max-w-2xl w-full max-h-[85vh] overflow-hidden shadow-2xl" data-detail-panel><div class="p-5 border-b flex items-start justify-between gap-4"><div><p class="text-xs font-semibold uppercase tracking-wide text-blue-600">Detalhamento da demanda</p><h2 id="detailTitle" class="font-bold text-xl mt-1"></h2></div><button type="button" onclick="closeDemandDetail()" class="p-2 rounded-lg text-slate-500 hover:bg-slate-100" aria-label="Fechar detalhamento"><i data-lucide="x"></i></button></div><div id="detailBody" class="p-5 overflow-y-auto max-h-[calc(85vh-88px)]"></div></div></div>
<script>
const NAV=[['dashboard','layout-dashboard','Visão geral','Visão consolidada das equipes'],['meeting','calendar-check','Histórico','Prioridades para tratar hoje'],['demands','list-checks','Demandas','Carteira completa e filtros'],['actions','check-square','Ações','Compromissos definidos'],['bottlenecks','triangle-alert','Gargalos','Aging, dependências e riscos'],['report','file-text','Resumo','Resumo pronto para reunião'],['data','database','Dados','Importação, equipes e backups']];
const KEY='radar-demandas-v1';
// O arquivo deve estar na mesma pasta (raiz publicada) desta aplicacao no SharePoint.
const BACKUP_URL=new URL('./backup_command.txt',window.location.href).href;
let state=load()||{demands:[],actions:[],imports:[],lastMeeting:null};
let filters={team:'all',status:'all',query:'',focus:null},demandSort={key:null,direction:null};
function load(){try{return JSON.parse(localStorage.getItem(KEY))}catch{return null}}
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function esc(v=''){return String(v).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function norm(s=''){return String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim()}
function uid(){return crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random().toString(16).slice(2)}
function toast(msg){const e=document.querySelector('#toast');e.textContent=msg;e.classList.remove('hidden');setTimeout(()=>e.classList.add('hidden'),2600)}
function parseDateValue(v){if(!v)return null;let s=String(v).trim();if(/^\d{5}(\.\d+)?$/.test(s)){let d=new Date(Date.UTC(1899,11,30)+Number(s)*864e5);return d}let m=s.match(/(\d{1,2})[\/.-](\d{1,2})(?:[\/.-](\d{2,4}))?/);if(m){let y=m[3]?Number(m[3]):new Date().getFullYear();if(y<100)y+=2000;return new Date(y,Number(m[2])-1,Number(m[1]))}let d=new Date(s);return isNaN(d)?null:d}
function iso(d){return d&&!isNaN(d)?d.toISOString().slice(0,10):''}
function fmt(d){if(!d)return 'Não informada';let x=typeof d==='string'?new Date(d+'T12:00:00'):d;return isNaN(x)?'Não informada':x.toLocaleDateString('pt-BR')}
function extractLatestDate(text, fallback){let ms=[...(text||'').matchAll(/(\d{1,2})[\/.-](\d{1,2})(?:[\/.-](\d{2,4}))?/g)];let ds=ms.map(m=>parseDateValue(m[0])).filter(Boolean);let f=parseDateValue(fallback);if(f)ds.push(f);return ds.length?iso(new Date(Math.max(...ds.map(Number)))):''}
function mapStatus(v){let s=norm(v);if(s.includes('conclu')||s.includes('finaliz'))return 'Concluído';if(s.includes('paus')||s.includes('suspens'))return 'Pausado';return 'Em andamento'}
function detectDeps(text){const known=['AUSTROS','CAF','CET','CPA','DE','DFAS','DO','DOFE','DOFS','DOGC','DOTI','DOTM','DOTV','DOVC','DOVL','DOVP','DRCC','DRJC','ECS','ENEL','GOF','GOL','GOM','GOO','GOT','GOV','GRC','GRH','GT','HEXAGON','MP','MRS','RH','RUMO','TIC','VP'];let u=(text||'').toUpperCase();return known.filter(x=>u.includes(x))}
function score(d){if(d.status==='Concluído')return 0;let n=0,age=daysSince(d.updatedAt||d.importedAt);if(age>30)n+=30;else if(age>15)n+=20;else if(age>7)n+=10;if(d.status==='Pausado')n+=15;if(d.dependencies?.length)n+=15;if(!d.owner)n+=10;if(/aguard|penden|cobrar|falta|bloque/i.test(d.details))n+=15;return Math.min(n,100)}
function daysSince(date){if(!date)return 0;return Math.max(0,Math.floor((new Date()-new Date(date+'T12:00:00'))/864e5))}
function health(d){let s=score(d);return s>=60?['Crítica','red']:s>=40?['Prioritária','orange']:s>=20?['Atenção','amber']:['Saudável','emerald']}
function teams(){return [...new Set(state.demands.map(d=>d.team))].sort()}
function matchesFocus(d){
  if(!filters.focus)return true;
  const {type,value}=filters.focus;
  if(type==='stale')return d.status!=='Concluído'&&daysSince(d.updatedAt)>15;
  if(type==='waiting')return d.status!=='Concluído'&&/aguard|penden|cobrar|falta/i.test(d.details||'');
  if(type==='dependencies')return d.status!=='Concluído'&&d.dependencies?.length>0;
  if(type==='dependency')return d.status!=='Concluído'&&d.dependencies?.includes(value);
  if(type==='demand')return d.id===value;
  return true;
}
function filtered(){return state.demands.filter(d=>(filters.team==='all'||d.team===filters.team)&&(filters.status==='all'||d.status===filters.status)&&(!filters.query||norm(d.title+' '+d.details+' '+d.owner).includes(norm(filters.query)))&&matchesFocus(d))}
function parseCSV(text){let rows=[],row=[],cell='',q=false;for(let i=0;i<text.length;i++){let c=text[i],n=text[i+1];if(c==='"'&&q&&n==='"'){cell+='"';i++}else if(c==='"'){q=!q}else if(c===','&&!q){row.push(cell);cell=''}else if((c==='\n'||c==='\r')&&!q){if(c==='\r'&&n==='\n')i++;row.push(cell);if(row.some(x=>x.trim()))rows.push(row);row=[];cell=''}else cell+=c}row.push(cell);if(row.some(x=>x.trim()))rows.push(row);if(!rows.length)return[];let h=rows.shift().map(norm);return rows.map(r=>Object.fromEntries(h.map((x,i)=>[x,(r[i]||'').trim()]))) }
function convertRows(rows,team,file){let now=iso(new Date());return rows.map((r,i)=>{let title=r['manchete']||r['demanda']||r['titulo']||r['tarefa']||r[Object.keys(r)[0]]||`Demanda ${i+1}`;let done=r['o que foi feito?']||r['o que foi feito']||r['entrega']||r['objetivo']||'';let details=r['status']||r['detalhes']||r['descricao']||'';let rawStatus=r['progresso']||r['situacao']||r['estado']||r['status']||'';let date=extractLatestDate(details,r['quando']||r['data']);return{id:uid(),title,done,details,status:mapStatus(rawStatus),owner:(r['quem?']||r['quem']||r['responsavel']||'').replace(/\\</g,'<'),team,sourceFile:file,updatedAt:date,importedAt:now,dependencies:detectDeps(details),createdAt:now}}).filter(d=>d.title)}
function badge(status){let c=status==='Concluído'?'emerald':status==='Pausado'?'slate':'blue';return `<span class="inline-flex items-center justify-center text-center min-h-6 px-2 py-1 rounded-full bg-${c}-50 text-${c}-700 text-xs font-medium leading-none">${status}</span>`}
function card(label,value,icon,color='blue',sub=''){return `<div class="bg-white border border-slate-200 rounded-2xl p-5"><div class="flex justify-between"><div><p class="text-sm text-slate-500">${label}</p><strong class="text-3xl text-ink mt-2 block">${value}</strong><small class="text-slate-400">${sub}</small></div><div class="w-11 h-11 rounded-xl bg-${color}-50 text-${color}-600 grid place-items-center"><i data-lucide="${icon}"></i></div></div></div>`}
function actionCard(label,value,icon,color,focusType){return `<button type="button" onclick="openDemandFilter('${focusType}')" class="w-full bg-white border border-slate-200 rounded-2xl p-5 text-left hover:border-${color}-300 hover:shadow-md focus:outline-none focus:ring-2 focus:ring-${color}-500 transition" aria-label="Filtrar demandas: ${label}"><div class="flex justify-between"><div><p class="text-sm text-slate-500">${label}</p><strong class="text-3xl text-ink mt-2 block">${value}</strong><small class="text-${color}-600 font-medium">Clique para ver as atividades</small></div><div class="w-11 h-11 rounded-xl bg-${color}-50 text-${color}-600 grid place-items-center"><i data-lucide="${icon}"></i></div></div></button>`}
function empty(title='Nenhum dado disponível',text='Importe um ou mais arquivos CSV para começar.'){return `<div class="bg-white border border-dashed rounded-2xl p-12 text-center"><i data-lucide="inbox" class="mx-auto w-10 h-10 text-slate-300"></i><h3 class="font-semibold mt-3">${title}</h3><p class="text-sm text-slate-500 mt-1">${text}</p><button data-go="data" class="mt-4 bg-blue-600 text-white rounded-lg px-4 py-2">Importar CSV</button></div>`}
function renderNav(){let html=NAV.map(([id,ic,l])=>`<button data-go="${id}" class="nav-btn ${id==='dashboard'?'active':''} w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm text-slate-600 hover:bg-slate-50"><i data-lucide="${ic}" class="w-5"></i>${l}</button>`).join('');sideNav.innerHTML=html;mobileNavItems.innerHTML=html}
function renderDashboard(){let ds=filters.team==='all'?state.demands:state.demands.filter(d=>d.team===filters.team),active=ds.filter(d=>d.status==='Em andamento'),critical=ds.filter(d=>score(d)>=40&&d.status!=='Concluído');let byTeam=teams().map(t=>({t,n:state.demands.filter(d=>d.team===t).length,a:state.demands.filter(d=>d.team===t&&d.status!=='Concluído').length}));document.querySelector('#view-dashboard').innerHTML=`
<div class="flex flex-wrap justify-between gap-3 mb-6"><div><h2 class="text-2xl font-bold text-ink">Mapeamento de demandas</h2><p class="text-slate-500">Informações oriundas dos CSVs importados.</p></div><select id="dashTeam" class="border rounded-xl px-3 bg-white"><option value="all">Todas as equipes</option>${teams().map(t=>`<option ${filters.team===t?'selected':''}>${esc(t)}</option>`).join('')}</select></div>
<div class="grid sm:grid-cols-2 xl:grid-cols-4 gap-4">${card('Total de demandas',ds.length,'layers','blue',`${teams().length} equipe(s)`)}${card('Em andamento',active.length,'activity','amber','Demandas ativas')}${card('Concluídas',ds.filter(d=>d.status==='Concluído').length,'circle-check','emerald','Entregas registradas')}${card('Exigem atenção',critical.length,'siren','red','Pontuação igual ou superior a 40')}</div>
<div class="grid xl:grid-cols-3 gap-6 mt-6"><div class="xl:col-span-2 bg-white border rounded-2xl p-5"><div class="flex justify-between mb-4"><h3 class="font-bold">Radar de atenção</h3><button data-go="meeting" class="text-sm text-blue-600">Ver pauta completa</button></div>${critical.length?critical.sort((a,b)=>score(b)-score(a)).map(d=>{let h=health(d);return `<div class="py-3 border-t first:border-0 flex gap-3 items-center"><div class="w-10 h-10 rounded-xl bg-${h[1]}-50 text-${h[1]}-600 grid place-items-center font-bold">${score(d)}</div><div class="min-w-0 flex-1"><strong class="block truncate">${esc(d.title)}</strong><span class="text-xs text-slate-500">${esc(d.team)} · ${d.updatedAt?daysSince(d.updatedAt)+' dias sem atualização':'data não identificada'} · ${h[0]}</span></div>${badge(d.status)}</div>`}).join(''):'<div class="py-8 text-center"><i data-lucide="circle-check" class="w-9 h-9 mx-auto text-emerald-500"></i><p class="mt-2 font-medium">Nenhuma demanda exige atenção</p><p class="text-sm text-slate-500">Não há atividades com score igual ou superior a 40.</p></div>'}</div>
<div class="bg-white border rounded-2xl p-5"><h3 class="font-bold mb-4">Distribuição por equipe</h3>${byTeam.length?byTeam.map(x=>`<button class="w-full text-left mb-4" onclick="setTeam('${esc(x.t)}')"><div class="flex justify-between text-sm mb-1"><span>${esc(x.t)}</span><strong>${x.n}</strong></div><div class="h-2 bg-slate-100 rounded-full"><div class="h-2 bg-blue-600 rounded-full" style="width:${x.n?Math.round(x.a/x.n*100):0}%"></div></div><small class="text-slate-400">${x.a} ativa(s)</small></button>`).join(''):'<p class="text-sm text-slate-500">Importe arquivos para segmentar as equipes.</p>'}</div></div>`;dashTeam?.addEventListener('change',e=>{filters.team=e.target.value;renderAll()})}
function renderMeeting(){let active=state.demands.filter(d=>d.status!=='Concluído'&&d.meetingEnabled!==false).sort((a,b)=>score(b)-score(a));document.querySelector('#view-meeting').innerHTML=`<div class="flex flex-wrap justify-between gap-3 mb-6"><div><h2 class="text-2xl font-bold">Pauta da reunião semanal</h2><p class="text-slate-500">Priorizada automaticamente por risco, tempo sem atualizar e dependências.</p></div><button onclick="markMeeting()" class="bg-blue-600 text-white rounded-xl px-4 py-2 inline-flex items-center justify-center gap-2 text-center"><i data-lucide="check"></i>Registrar reunião de hoje</button></div>${active.length?`<div class="space-y-4">${active.map((d,i)=>{let h=health(d);return `<article class="bg-white border rounded-2xl p-5"><div class="flex flex-wrap gap-3 justify-between"><div class="flex gap-3"><span class="w-9 h-9 rounded-lg bg-slate-100 grid place-items-center font-bold">${i+1}</span><div><h3 class="font-bold">${esc(d.title)}</h3><p class="text-sm text-slate-500">${esc(d.team)} · ${esc(d.owner||'Sem responsável')}</p></div></div><div class="flex gap-2">${badge(d.status)}<span class="inline-flex items-center justify-center text-center min-h-6 px-2 py-1 rounded-full text-xs leading-none bg-${h[1]}-50 text-${h[1]}-700">${h[0]} · ${score(d)}</span></div></div><p class="mt-4 text-sm text-slate-600 leading-relaxed">${esc(d.details||'Sem histórico informado.')}</p><div class="mt-4 pt-4 border-t flex flex-wrap gap-2"><button onclick="editDemand('${d.id}')" class="px-3 py-2 border rounded-lg text-sm">Atualizar</button><button onclick="completeDemand('${d.id}')" class="px-3 py-2 border rounded-lg text-sm">Concluir</button><button onclick="addAction('${d.id}')" class="px-3 py-2 bg-ink text-white rounded-lg text-sm">Adicionar ação</button><span class="ml-auto text-xs text-slate-400 self-center">Última data: ${fmt(d.updatedAt)}</span></div></article>`}).join('')}</div>`:empty('Pauta limpa','Não há demandas ativas para tratar.')}`}
function sortDemandTable(key,type='text'){if(demandSort.key===key)demandSort.direction=demandSort.direction==='asc'?'desc':'asc';else{demandSort.key=key;demandSort.direction=type==='number'?'desc':'asc'}updateDemandResults()}
function demandSortIcon(key){if(demandSort.key!==key)return '<i data-lucide="chevrons-up-down" class="w-4 h-4 text-slate-400"></i>';return `<i data-lucide="${demandSort.direction==='asc'?'arrow-up':'arrow-down'}" class="w-4 h-4 text-blue-600"></i>`}
function sortableDemandHeader(label,key,type='text'){return `<button type="button" onclick="sortDemandTable('${key}','${type}')" class="w-full inline-flex items-center gap-1.5 font-semibold hover:text-blue-600 focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-500 rounded" title="Ordenar por ${label}" aria-label="Ordenar por ${label}">${label}${demandSortIcon(key)}</button>`}
function demandResultsHtml(){let ds=[...filtered()];if(demandSort.key){let dir=demandSort.direction==='asc'?1:-1;ds.sort((a,b)=>{let av,bv;if(demandSort.key==='score'){av=score(a);bv=score(b);return (av-bv)*dir}av=demandSort.key==='title'?a.title:demandSort.key==='team'?a.team:demandSort.key==='owner'?(a.owner||'Não informado'):a.status;bv=demandSort.key==='title'?b.title:demandSort.key==='team'?b.team:demandSort.key==='owner'?(b.owner||'Não informado'):b.status;return String(av||'').localeCompare(String(bv||''),'pt-BR',{sensitivity:'base',numeric:true})*dir})}return ds.length?`<div class="bg-white border rounded-2xl overflow-x-auto"><table class="w-full text-sm"><thead class="bg-slate-50 text-left"><tr><th class="p-4">${sortableDemandHeader('Demanda','title')}</th><th class="p-4">${sortableDemandHeader('Equipe','team')}</th><th class="p-4">${sortableDemandHeader('Responsável','owner')}</th><th class="p-4">${sortableDemandHeader('Situação','status')}</th><th class="p-4">${sortableDemandHeader('Atenção','score','number')}</th><th class="p-4"></th></tr></thead><tbody>${ds.map(d=>`<tr tabindex="0" role="button" aria-label="Abrir detalhes de ${esc(d.title)}" onclick="openDemandDetail('${d.id}')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();openDemandDetail('${d.id}')}" class="border-t hover:bg-slate-50 cursor-pointer focus:outline-none focus:bg-blue-50"><td class="p-4"><strong>${esc(d.title)}</strong><small class="block text-slate-400 mt-1">${esc(d.sourceFile)}</small></td><td class="p-4">${esc(d.team)}</td><td class="p-4">${esc(d.owner||'Não informado')}</td><td class="p-4">${badge(d.status)}</td><td class="p-4 font-semibold">${score(d)}</td><td class="p-4"><button onclick="event.stopPropagation();editDemand('${d.id}')" class="text-blue-600">Editar</button></td></tr>`).join('')}</tbody></table></div>`:empty('Nenhuma demanda encontrada','Ajuste os filtros ou importe um CSV.')}
function updateDemandResults(){let area=document.querySelector('#demandResults');if(area){area.innerHTML=demandResultsHtml();lucide.createIcons()}}
function renderDemands(){document.querySelector('#view-demands').innerHTML=`<div class="flex flex-wrap justify-between gap-3 mb-5"><div><h2 class="text-2xl font-bold">Demandas</h2><p class="text-slate-500">Consulte e atualize as demandas mapeadas.</p></div><button onclick="newDemand()" class="bg-blue-600 text-white rounded-xl px-4 py-2">Nova demanda</button></div>${focusBanner()}<div class="bg-white border rounded-2xl p-4 mb-5 grid md:grid-cols-3 gap-3"><input id="fQuery" value="${esc(filters.query)}" placeholder="Pesquisar..." autocomplete="off" class="border rounded-xl px-3 py-2"><select id="fTeam" class="border rounded-xl px-3"><option value="all">Todas as equipes</option>${teams().map(t=>`<option ${filters.team===t?'selected':''}>${esc(t)}</option>`).join('')}</select><select id="fStatus" class="border rounded-xl px-3"><option value="all">Todos os status</option>${['Em andamento','Pausado','Concluído'].map(s=>`<option ${filters.status===s?'selected':''}>${s}</option>`).join('')}</select></div><div id="demandResults">${demandResultsHtml()}</div>`;document.getElementById('fQuery')?.addEventListener('input',e=>{filters.query=e.target.value;updateDemandResults()});document.getElementById('fTeam')?.addEventListener('change',e=>{filters.team=e.target.value;updateDemandResults()});document.getElementById('fStatus')?.addEventListener('change',e=>{filters.status=e.target.value;updateDemandResults()})}
function renderActions(){let a=state.actions.filter(x=>!x.hidden);document.querySelector('#view-actions').innerHTML=`<div class="flex justify-between mb-6"><div><h2 class="text-2xl font-bold">Ações</h2><p class="text-slate-500">Compromissos definidos durante as reuniões.</p></div><button onclick="addAction('')" class="bg-blue-600 text-white rounded-xl px-4 py-2">Nova ação</button></div>${a.length?`<div class="grid lg:grid-cols-2 gap-4">${a.map(x=>{let d=state.demands.find(d=>d.id===x.demandId);return `<div class="bg-white border rounded-2xl p-5 flex gap-3"><input type="checkbox" ${x.done?'checked':''} onchange="toggleAction('${x.id}')" class="mt-1 w-5 h-5"><div class="flex-1 ${x.done?'line-through opacity-50':''}"><strong>${esc(x.text)}</strong><p class="text-sm text-slate-500 mt-1">${esc(d?.title||'Ação geral')} · ${esc(x.owner||'Sem responsável')}</p><small class="text-slate-400">Prazo: ${fmt(x.due)}</small></div><button type="button" onclick="clearAction('${x.id}')" class="self-start p-2 rounded-lg text-slate-400 hover:bg-red-50 hover:text-red-600" title="Limpar ação desta view" aria-label="Limpar ação desta view"><i data-lucide="x" class="w-4 h-4"></i></button></div>`}).join('')}</div>`:empty('Nenhuma ação cadastrada','Crie ações a partir da pauta da reunião.')}`}
function renderBottlenecks(){let active=state.demands.filter(d=>d.status!=='Concluído'),deps={};active.forEach(d=>d.dependencies.forEach(x=>deps[x]=(deps[x]||0)+1));document.querySelector('#view-bottlenecks').innerHTML=`<div class="mb-6"><h2 class="text-2xl font-bold">Gargalos e riscos</h2><p class="text-slate-500">Leitura por tempo sem atualizar, espera e dependências citadas. Clique em qualquer indicador para abrir as atividades filtradas.</p></div><div class="grid md:grid-cols-3 gap-4">${actionCard('Sem atualização +15 dias',active.filter(d=>daysSince(d.updatedAt)>15).length,'clock-3','amber','stale')}${actionCard('Aguardando / pendente',active.filter(d=>/aguard|penden|cobrar|falta/i.test(d.details)).length,'hourglass','red','waiting')}${actionCard('Com dependência identificada',active.filter(d=>d.dependencies.length).length,'git-branch','violet','dependencies')}</div><div class="grid lg:grid-cols-2 gap-6 mt-6"><div class="bg-white border rounded-2xl p-5"><h3 class="font-bold mb-4">Dependências mais citadas</h3>${Object.entries(deps).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<button type="button" onclick="openDemandFilter('dependency','${esc(k)}')" class="w-full flex justify-between items-center border-t py-3 px-2 -mx-2 text-left rounded-lg hover:bg-violet-50 focus:outline-none focus:ring-2 focus:ring-violet-500"><span>${esc(k)}</span><strong>${v} demanda(s)</strong></button>`).join('')||'<p class="text-sm text-slate-500">Nenhuma dependência reconhecida.</p>'}</div><div class="bg-white border rounded-2xl p-5"><h3 class="font-bold mb-4">Demandas mais antigas</h3>${active.sort((a,b)=>daysSince(b.updatedAt)-daysSince(a.updatedAt)).slice(0,8).map(d=>`<button type="button" onclick="openDemandFilter('demand','${d.id}')" class="w-full flex justify-between items-center border-t py-3 px-2 -mx-2 gap-3 text-left rounded-lg hover:bg-blue-50 focus:outline-none focus:ring-2 focus:ring-blue-500"><span>${esc(d.title)}</span><strong class="whitespace-nowrap">${d.updatedAt?daysSince(d.updatedAt)+' dias':'Sem data'}</strong></button>`).join('')||'<p class="text-sm text-slate-500">Não há demandas ativas.</p>'}</div></div>`}
function renderReport(){let active=state.demands.filter(d=>d.status!=='Concluído').sort((a,b)=>score(b)-score(a)),done=state.demands.filter(d=>d.status==='Concluído');document.querySelector('#view-report').innerHTML=`<div class="no-print flex flex-wrap justify-between mb-6"><div><h2 class="text-2xl font-bold">Resumo</h2><p class="text-slate-500">Documento sintético para condução da reunião.</p></div><button onclick="window.print()" class="bg-ink text-white rounded-xl px-4 py-2 inline-flex items-center justify-center gap-2 text-center"><i data-lucide="printer"></i>Imprimir / PDF</button></div><article class="bg-white border rounded-2xl p-6 md:p-10 max-w-5xl"><div class="border-b pb-6"><p class="text-blue-600 font-semibold">RADAR DE DEMANDAS</p><h1 class="text-3xl font-bold mt-1">Pauta semanal</h1><p class="text-slate-500 mt-2">Gerado em ${new Date().toLocaleString('pt-BR')} · ${teams().length} equipe(s) · ${state.demands.length} demanda(s)</p></div><h2 class="text-xl font-bold mt-8 mb-4">Prioridades para decisão e acompanhamento</h2>${active.slice(0,10).map(d=>`<section class="py-4 border-t"><div class="flex justify-between gap-3"><strong>${esc(d.title)}</strong><span class="font-bold">Score ${score(d)}</span></div><p class="text-sm text-slate-500">${esc(d.team)} · ${esc(d.owner||'Sem responsável')} · ${d.updatedAt?'atualização em '+fmt(d.updatedAt):'sem data identificada'}</p><p class="mt-2 text-sm">${esc(d.details||'Sem detalhamento')}</p><p class="mt-2 text-sm font-medium">Recomendação: ${score(d)>=40?'validar bloqueio, responsável e próximo prazo':'acompanhar evolução e registrar próximo passo'}.</p></section>`).join('')||'<p>Não há prioridades ativas.</p>'}<h2 class="text-xl font-bold mt-8 mb-4">Resumo das demandas</h2><p>${active.length} demanda(s) ativa(s), ${done.length} concluída(s) e ${active.filter(d=>d.status==='Pausado').length} pausada(s).</p></article>`}
function renderData(){document.querySelector('#view-data').innerHTML=`<div class="mb-6"><h2 class="text-2xl font-bold">Dados e importações</h2><p class="text-slate-500">Cada nome de arquivo vira automaticamente o identificador da equipe.</p></div><label id="dropZone" class="block bg-white border-2 border-dashed rounded-2xl p-10 text-center cursor-pointer hover:border-blue-400 transition"><input id="csvFiles" type="file" accept=".csv,text/csv" multiple class="hidden"><i data-lucide="files" class="mx-auto w-12 h-12 text-blue-500"></i><h3 class="font-bold mt-3">Selecione ou arraste múltiplos arquivos CSV</h3><p class="text-sm text-slate-500 mt-1">Exemplo: DOTI.csv será importado como equipe “DOTI”.</p><span class="inline-block mt-4 bg-blue-600 text-white px-4 py-2 rounded-lg">Escolher arquivos</span></label><div class="grid lg:grid-cols-2 gap-6 mt-6"><div class="bg-white border rounded-2xl p-5"><h3 class="font-bold mb-4">Arquivos importados</h3>${state.imports.length?state.imports.map(x=>`<div class="flex justify-between items-center border-t py-3"><div><strong>${esc(x.team)}</strong><small class="block text-slate-400">${esc(x.file)} · ${x.count} registros</small></div><button onclick="removeTeam('${esc(x.team)}')" class="text-red-600 text-sm">Remover</button></div>`).join(''):'<p class="text-sm text-slate-500">Nenhum arquivo importado.</p>'}</div><div class="bg-white border rounded-2xl p-5"><h3 class="font-bold mb-4">Backup e manutenção</h3><div class="grid gap-3"><button onclick="backup()" class="border rounded-xl px-4 py-3 text-left">Exportar backup TXT</button><label class="border rounded-xl px-4 py-3 cursor-pointer">Restaurar backup TXT ou JSON<input id="restore" type="file" accept=".txt,.json,text/plain,application/json" class="hidden"></label><button onclick="clearAll()" class="border border-red-200 text-red-600 rounded-xl px-4 py-3 text-left">Apagar todos os dados</button></div></div></div><section class="mt-6 bg-white border border-slate-200 rounded-2xl p-5 md:p-6"><div class="flex items-start gap-3"><div class="w-10 h-10 shrink-0 rounded-xl bg-blue-50 text-blue-600 grid place-items-center"><i data-lucide="calculator"></i></div><div><h3 class="font-bold text-lg text-ink">Como o score de atenção é calculado</h3><p class="text-sm text-slate-600 mt-1 leading-relaxed">O score indica o nível de atenção operacional de cada demanda. Ele começa em <strong>0 ponto</strong>, soma os critérios abaixo e é limitado a <strong>100 pontos</strong>. Demandas concluídas recebem score 0, independentemente dos demais critérios.</p></div></div><div class="mt-5 grid md:grid-cols-2 gap-4 text-sm"><div class="rounded-xl bg-slate-50 p-4"><h4 class="font-semibold text-ink">1. Tempo sem atualização</h4><ul class="mt-2 space-y-1 text-slate-600"><li>Mais de 30 dias: <strong>+30</strong></li><li>De 16 a 30 dias: <strong>+20</strong></li><li>De 8 a 15 dias: <strong>+10</strong></li><li>Até 7 dias ou sem data identificada: <strong>+0</strong></li></ul></div><div class="rounded-xl bg-slate-50 p-4"><h4 class="font-semibold text-ink">2. Condições adicionais</h4><ul class="mt-2 space-y-1 text-slate-600"><li>Status “Pausado”: <strong>+15</strong></li><li>Ao menos uma dependência identificada: <strong>+15</strong></li><li>Responsável não informado: <strong>+10</strong></li><li>Histórico contém “aguard”, “penden”, “cobrar”, “falta” ou “bloque”: <strong>+15</strong></li></ul></div></div><div class="mt-4 rounded-xl border border-blue-200 bg-blue-50 p-4 text-sm text-blue-950"><p><strong>Fórmula:</strong> score = pontos por tempo + status pausado + dependência + ausência de responsável + termos de espera/bloqueio. Resultado máximo: 100.</p><p class="mt-2"><strong>Exemplo de score 60:</strong> 20 pontos por 16–30 dias sem atualização + 15 por estar pausada + 15 por ter dependência + 10 por não possuir responsável = 60.</p><p class="mt-2"><strong>Exemplo de score 30:</strong> 30 pontos por mais de 30 dias sem atualização, sem nenhuma outra condição adicional = 30.</p></div><div class="mt-4 flex flex-wrap gap-2 text-xs"><span class="rounded-full bg-emerald-50 text-emerald-700 px-3 py-1 font-medium">0–19: Saudável</span><span class="rounded-full bg-amber-50 text-amber-700 px-3 py-1 font-medium">20–39: Atenção</span><span class="rounded-full bg-orange-50 text-orange-700 px-3 py-1 font-medium">40–59: Prioritária</span><span class="rounded-full bg-red-50 text-red-700 px-3 py-1 font-medium">60–100: Crítica</span></div><p class="mt-4 text-xs text-slate-500">As dependências são reconhecidas quando o histórico cita termos cadastrados na aplicação, como AUSTROS, CAF, CET, CPA, DE, DFAS, DO, DOFE, DOFS, DOGC, DOTI, DOTM, DOTV, DOVC, DOVL, DOVP, DRCC, DRJC, ECS, ENEL, GOF, GOL, GOM, GOO, GOT, GOV, GRC, GRH, GT, HEXAGON, MP, MRS, RH, RUMO, TIC ou VP.</p></section>`;let input=document.querySelector('#csvFiles'),zone=document.querySelector('#dropZone');input.addEventListener('change',e=>importFiles(e.target.files));['dragenter','dragover'].forEach(x=>zone.addEventListener(x,e=>{e.preventDefault();zone.classList.add('drop-active')}));['dragleave','drop'].forEach(x=>zone.addEventListener(x,e=>{e.preventDefault();zone.classList.remove('drop-active')}));zone.addEventListener('drop',e=>importFiles(e.dataTransfer.files));document.querySelector('#restore').addEventListener('change',restoreBackup)}
function focusLabel(){
  if(!filters.focus)return '';
  const {type,value}=filters.focus;
  if(type==='stale')return 'Sem atualização há mais de 15 dias';
  if(type==='waiting')return 'Aguardando / pendente';
  if(type==='dependencies')return 'Com dependência identificada';
  if(type==='dependency')return `Dependência: ${value}`;
  if(type==='demand'){let d=state.demands.find(x=>x.id===value);return `Demanda selecionada: ${d?.title||'registro'}`;}
  return 'Filtro de gargalo';
}
function focusBanner(){return filters.focus?`<div class="mb-4 flex flex-wrap items-center justify-between gap-3 rounded-xl border border-blue-200 bg-blue-50 px-4 py-3"><div><span class="text-xs font-semibold uppercase tracking-wide text-blue-600">Filtro originado em Gargalos</span><strong class="block text-sm text-blue-900">${esc(focusLabel())}</strong></div><button type="button" onclick="clearDemandFocus()" class="rounded-lg border border-blue-300 bg-white px-3 py-2 text-sm font-medium text-blue-700 hover:bg-blue-100">Limpar filtro especial</button></div>`:''}
function openDemandFilter(type,value=''){filters.focus={type,value};filters.team='all';filters.status='all';filters.query='';renderDemands();go('demands')}
function clearDemandFocus(){filters.focus=null;renderDemands();lucide.createIcons()}
function renderAll(){renderDashboard();renderMeeting();renderDemands();renderActions();renderBottlenecks();renderReport();renderData();lucide.createIcons()}
async function importFiles(files){let list=[...files].filter(f=>f.name.toLowerCase().endsWith('.csv'));if(!list.length)return toast('Selecione arquivos CSV válidos.');for(let file of list){let team=file.name.replace(/\.csv$/i,'').trim();let rows=parseCSV(await file.text()),items=convertRows(rows,team,file.name);state.demands=state.demands.filter(d=>d.team!==team);state.imports=state.imports.filter(x=>x.team!==team);state.demands.push(...items);state.imports.push({team,file:file.name,count:items.length,at:new Date().toISOString()})}save();renderAll();toast(`${list.length} arquivo(s) importado(s) com sucesso.`)}
function go(id){document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));document.querySelector('#view-'+id)?.classList.add('active');document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('active',b.dataset.go===id));let n=NAV.find(x=>x[0]===id);pageTitle.textContent=n[2];pageSubtitle.textContent=n[3];mobileNav.classList.add('hidden');window.scrollTo({top:0,behavior:'smooth'});lucide.createIcons()}
function detailItem(label,value,wide=false){return `<div class="${wide?'md:col-span-2':''}"><p class="text-xs font-semibold uppercase tracking-wide text-slate-400">${label}</p><div class="mt-1 text-sm text-slate-700 ${wide?'whitespace-pre-wrap leading-6':''}">${value||'<span class="text-slate-400">Não informado</span>'}</div></div>`}
function openDemandDetail(id){
  const d=state.demands.find(x=>x.id===id);if(!d)return;
  const h=health(d),actions=state.actions.filter(a=>a.demandId===id),deps=d.dependencies?.length?d.dependencies.map(x=>`<span class="inline-flex rounded-full bg-violet-50 px-2 py-1 text-xs text-violet-700">${esc(x)}</span>`).join(' '):'';
  detailTitle.textContent=d.title||'Demanda sem título';
  detailBody.innerHTML=`<div class="grid md:grid-cols-2 gap-x-6 gap-y-5">${detailItem('Descrição',esc(d.details||''),true)}${detailItem('Equipe',esc(d.team||''))}${detailItem('Responsável',esc(d.owner||''))}${detailItem('Status',badge(d.status||'Em andamento'))}${detailItem('Pontuação',`<strong class="text-lg">${score(d)}</strong> <span class="ml-2 inline-flex rounded-full bg-${h[1]}-50 px-2 py-1 text-xs text-${h[1]}-700">${h[0]}</span>`)}${detailItem('Última atualização',fmt(d.updatedAt))}${detailItem('Origem',esc(d.sourceFile||''))}${detailItem('Dependências',deps,true)}${detailItem('Ações vinculadas',actions.length?actions.map(a=>`<div class="mt-2 rounded-xl border p-3"><strong>${esc(a.text)}</strong><p class="mt-1 text-xs text-slate-500">${esc(a.owner||'Sem responsável')} · Prazo: ${fmt(a.due)}${a.done?' · Concluída':''}</p></div>`).join(''):'',true)}</div>`;
  detailModal.classList.remove('hidden');detailModal.classList.add('flex');document.body.classList.add('overflow-hidden');lucide.createIcons();
}
function closeDemandDetail(){detailModal.classList.add('hidden');detailModal.classList.remove('flex');document.body.classList.remove('overflow-hidden')}
function openModal(title,body,onSubmit){modalTitle.textContent=title;modalForm.innerHTML=body+`<div class="flex justify-end gap-2 pt-3"><button type="button" onclick="closeModal()" class="border rounded-lg px-4 py-2">Cancelar</button><button class="bg-blue-600 text-white rounded-lg px-4 py-2">Salvar</button></div>`;modal.classList.remove('hidden');modal.classList.add('flex');modalForm.onsubmit=e=>{e.preventDefault();onSubmit(new FormData(e.target));closeModal();save();renderAll()};lucide.createIcons()}
function closeModal(){modal.classList.add('hidden');modal.classList.remove('flex')}
function demandForm(d={}){return `<label class="block text-sm">Demanda<input name="title" required value="${esc(d.title||'')}" class="mt-1 w-full border rounded-lg px-3 py-2"></label><div class="grid grid-cols-2 gap-3"><label class="text-sm">Equipe<input name="team" required value="${esc(d.team||teams()[0]||'Geral')}" class="mt-1 w-full border rounded-lg px-3 py-2"></label><label class="text-sm">Status<select name="status" class="mt-1 w-full border rounded-lg px-3 py-2">${['Em andamento','Pausado','Concluído'].map(s=>`<option ${d.status===s?'selected':''}>${s}</option>`).join('')}</select></label></div><label class="block text-sm">Responsável<input name="owner" value="${esc(d.owner||'')}" class="mt-1 w-full border rounded-lg px-3 py-2"></label><label class="block text-sm">Histórico / situação<textarea name="details" rows="5" class="mt-1 w-full border rounded-lg px-3 py-2">${esc(d.details||'')}</textarea></label>`}
function editDemand(id){let d=state.demands.find(x=>x.id===id);openModal('Atualizar demanda',demandForm(d),f=>{Object.assign(d,Object.fromEntries(f));d.updatedAt=iso(new Date());d.dependencies=detectDeps(d.details)})}
function newDemand(){openModal('Nova demanda',demandForm()+`<label class="flex items-start gap-3 rounded-xl border border-blue-200 bg-blue-50 p-3 text-sm"><input name="meetingEnabled" type="checkbox" value="true" checked class="mt-0.5 w-4 h-4"><span><strong class="block text-blue-900">Incluir na reunião semanal</strong><span class="text-blue-700">A demanda será inserida na pauta e receberá pontuação automaticamente.</span></span></label>`,f=>{let x=Object.fromEntries(f);state.demands.push({...x,id:uid(),meetingEnabled:x.meetingEnabled==='true',sourceFile:'Cadastro manual',createdAt:iso(new Date()),importedAt:iso(new Date()),updatedAt:iso(new Date()),dependencies:detectDeps(x.details)})})}
function completeDemand(id){let d=state.demands.find(x=>x.id===id);d.status='Concluído';d.updatedAt=iso(new Date());save();renderAll();toast('Demanda concluída.')}
function addAction(id){openModal('Nova ação',`<label class="block text-sm">Ação<input name="text" required class="mt-1 w-full border rounded-lg px-3 py-2"></label><label class="block text-sm">Demanda<select name="demandId" class="mt-1 w-full border rounded-lg px-3 py-2"><option value="">Ação geral</option>${state.demands.filter(d=>d.status!=='Concluído').map(d=>`<option value="${d.id}" ${d.id===id?'selected':''}>${esc(d.title)}</option>`).join('')}</select></label><div class="grid grid-cols-2 gap-3"><label class="text-sm">Responsável<input name="owner" class="mt-1 w-full border rounded-lg px-3 py-2"></label><label class="text-sm">Prazo<input name="due" type="date" class="mt-1 w-full border rounded-lg px-3 py-2"></label></div>`,f=>{let x=Object.fromEntries(f),createdAt=iso(new Date()),action={...x,id:uid(),done:false,hidden:false,createdAt};state.actions.push(action);if(x.demandId){let d=state.demands.find(y=>y.id===x.demandId);if(d){let registro=`${new Date().toLocaleDateString('pt-BR')} - Ação definida: ${x.text}${x.owner?' | Responsável: '+x.owner:''}${x.due?' | Prazo: '+fmt(x.due):''}`;d.details=[d.details,registro].filter(Boolean).join('\n');d.updatedAt=createdAt;d.dependencies=detectDeps(d.details)}}})}
function toggleAction(id){let a=state.actions.find(x=>x.id===id);a.done=!a.done;save();renderAll();lucide.createIcons()}
function clearAction(id){let a=state.actions.find(x=>x.id===id);if(!a)return;a.hidden=true;save();renderActions();lucide.createIcons();toast('Ação removida desta view. O registro permanece no histórico da demanda.')}
function setTeam(t){filters.team=filters.team===t?'all':t;renderAll();toast(filters.team==='all'?'Filtro de equipe removido.':`Filtro aplicado: ${t}`)}
function markMeeting(){state.lastMeeting=new Date().toISOString();save();toast('Reunião registrada em '+new Date().toLocaleDateString('pt-BR'))}
function removeTeam(t){if(!confirm(`Remover todos os dados da equipe ${t}?`))return;state.demands=state.demands.filter(d=>d.team!==t);state.imports=state.imports.filter(x=>x.team!==t);save();renderAll()}
function backup(){let blob=new Blob([JSON.stringify(state,null,2)],{type:'text/plain;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='backup_command.txt';a.click();URL.revokeObjectURL(a.href)}
function applyBackupState(x){
  if(!x||!Array.isArray(x.demands))throw new Error('Formato de backup incompatível.');
  state={
    demands:x.demands,
    actions:Array.isArray(x.actions)?x.actions:[],
    imports:Array.isArray(x.imports)?x.imports:[],
    lastMeeting:x.lastMeeting||null
  };
  state.demands.forEach(d=>{if(!Array.isArray(d.dependencies))d.dependencies=detectDeps(d.details||'');if(d.meetingEnabled===undefined)d.meetingEnabled=true});
  save();renderAll();
}
async function updateFromSharePointBackup(){
  try{
    const response=await fetch(`${BACKUP_URL}?v=${Date.now()}`,{credentials:'include',cache:'no-store',headers:{Accept:'text/plain, application/json'}});
    if(!response.ok)throw new Error(`HTTP ${response.status}`);
    const content=(await response.text()).replace(/^\uFEFF/,'').trim();
    if(/^<!doctype html|^<html/i.test(content))throw new Error('O SharePoint retornou uma pagina HTML em vez do arquivo de backup.');
    applyBackupState(JSON.parse(content));
    toast(`Backup automatico carregado: ${state.demands.length} demanda(s).`);
  }catch(error){
    console.error('Erro ao carregar backup automatico:',error);
    const localFile=window.location.protocol==='file:';
    toast(localFile?'A atualizacao automatica exige que a aplicacao seja aberta pelo SharePoint.':`Nao foi possivel carregar backup_command.txt: ${error.message}`);
  }
}
function restoreBackup(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{applyBackupState(JSON.parse(r.result.replace(/^\uFEFF/,'')));toast('Backup restaurado.')}catch{toast('Arquivo de backup inválido.')}};r.readAsText(f)}
function clearAll(){if(confirm('Apagar definitivamente todos os dados locais?')){state={demands:[],actions:[],imports:[],lastMeeting:null};save();renderAll();toast('Dados apagados.')}}
detailModal.addEventListener('click',e=>{if(e.target===detailModal)closeDemandDetail()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!detailModal.classList.contains('hidden'))closeDemandDetail()});
document.addEventListener('click',e=>{let b=e.target.closest('[data-go]');if(b)go(b.dataset.go)});mobileMenu.onclick=()=>mobileNav.classList.remove('hidden');closeMenu.onclick=()=>mobileNav.classList.add('hidden');quickBackup.onclick=backup;
renderNav();renderAll();
// Mesmo fluxo da referencia Prazius: carrega a interface e, em seguida,
// busca automaticamente o backup mais recente no SharePoint sem usar cache.
window.addEventListener('DOMContentLoaded',()=>window.setTimeout(updateFromSharePointBackup,0),{once:true});
</script>
