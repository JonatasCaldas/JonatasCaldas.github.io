<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculis</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = { theme: { extend: { colors: { accent: '#6FE6FC', 'accent-dark': '#5ACCE0' } } } };
  </script>
  <style>
    body { background:#f8fafc; font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif; }
    ::-webkit-scrollbar{width:6px;height:6px} ::-webkit-scrollbar-track{background:#f1f5f9} ::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:3px}
    @keyframes fadeIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}} .animate-fade-in{animation:fadeIn .25s ease-out forwards}
    .timeline-event{border-left:6px solid #00ADB5;transition:transform .15s ease,box-shadow .15s ease}.timeline-event.grupo-externo{border-left-color:#00ADB5;box-shadow:0 3px 10px rgba(0,173,181,.16)}
    .timeline-event.grupo-ecs{border-left-color:#7C3AED}.timeline-event.etapa-especial{border-right:6px solid #F59E0B;background:linear-gradient(90deg,#fff 0%,#fff8e6 100%)}
    .timeline-event.selecionada{border-left-color:#111827;background:#e9fbfc;font-weight:700;transform:translateX(4px);box-shadow:0 8px 18px rgba(15,23,42,.14)}
    .timeline-event.selecionada.etapa-especial{background:linear-gradient(90deg,#e9fbfc 0%,#fff3ce 100%)}
  </style>
</head>
<body class="text-gray-800 antialiased min-h-screen">
<div class="flex min-h-screen w-full">
  <aside id="sidebar" class="bg-white border-r border-gray-200 w-64 fixed inset-y-0 left-0 z-30 -translate-x-full transition-transform duration-300 md:relative md:translate-x-0 md:flex-shrink-0 shadow-sm flex flex-col">
    <div class="p-6 border-b border-gray-100">
      <div class="flex items-start justify-between gap-3">
        <div><h1 class="text-2xl font-bold text-gray-900 tracking-tight">Calculis</h1><p class="text-xs text-gray-500 font-medium mt-1">Calculadora de prazos</p></div>
        <button id="close-sidebar-btn" class="md:hidden text-gray-400 hover:text-gray-700"><i data-lucide="x"></i></button>
      </div>
    </div>
    <nav class="p-4 flex-1 overflow-y-auto">
      <h2 class="text-xs font-bold uppercase text-gray-400 tracking-wider mb-3 px-3">Navegação</h2>
      <ul class="space-y-1">
        <li><button data-view="calculadora" class="nav-link w-full flex items-center gap-3 px-3 py-2 rounded-md text-sm font-semibold"><i data-lucide="calculator" class="w-4 h-4"></i>Calculadora</button></li>
        <li><button data-view="configuracoes" class="nav-link w-full flex items-center gap-3 px-3 py-2 rounded-md text-sm font-semibold"><i data-lucide="settings" class="w-4 h-4"></i>Configurações</button></li>
      </ul>
    </nav>
    <footer class="px-5 py-4 border-t border-gray-100 bg-gray-50 text-center"><p class="text-[11px] text-gray-500 font-medium">Planejamento e acompanhamento de prazos</p></footer>
  </aside>

  <div class="flex-1 flex flex-col min-w-0">
    <header class="bg-white border-b border-gray-200 sticky top-0 z-20 md:hidden">
      <div class="flex items-center justify-between h-16 px-4"><button id="open-sidebar-btn" class="text-gray-600"><i data-lucide="menu"></i></button><span class="font-bold text-gray-900 text-lg">Calculis</span><div class="w-6"></div></div>
    </header>
    <main class="flex-1 p-6 md:p-10 max-w-none w-full mx-auto"><div id="main-content" class="animate-fade-in"></div></main>
  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
  const etapas = [
    {nome:'Elaboração do ECS (Doc. Completa) - Iniciar ECS',duracao:7},{nome:'Elaboração do ECS (Doc. Completa) - Entregar Projeto Básico',duracao:12},
    {nome:'Elaboração do ECS (Doc. Completa) - Contrato Modelado',duracao:17},{nome:'Elaboração do ECS (Doc. Completa) - Solicitar SIEC',duracao:30},
    {nome:'Elaboração do ECS (Doc. Completa) - Preparar para RAV',duracao:10},{nome:'Valoração',duracao:30},{nome:'Finalização do ECS (Doc. Completa)',duracao:11},
    {nome:'Emissão e Aprovação da SC',duracao:3},{nome:'Instaurar Processo',duracao:2},{nome:'Elaborar Edital',duracao:10},{nome:'Reserva de Verba',duracao:4},
    {nome:'Chancelar Edital',duracao:13},{nome:'Aprovar Edital em RD',duracao:3},{nome:'Publicar Edital',duracao:3},{nome:'Prazo mínimo para abertura da sessão',duracao:3},
    {nome:'Sessão Pública Eletrônica',duracao:7},{nome:'Homologar resultado final em RD',duracao:5},{nome:'Assinatura do Contrato',duracao:10},{nome:'Desembolso',duracao:30}
  ];
  let activeView='calculadora', calculoRealizado=false, ultimoCalculo=null;
  const main=document.getElementById('main-content'), sidebar=document.getElementById('sidebar');
  const inputClass='block w-full text-sm border-gray-300 rounded-md shadow-sm focus:border-accent focus:ring-accent p-2.5 border bg-white';

  function formatarEntradaData(valor){
    const numeros=valor.replace(/\D/g,'').slice(0,8);
    if(numeros.length<=2)return numeros;
    if(numeros.length<=4)return `${numeros.slice(0,2)}/${numeros.slice(2)}`;
    return `${numeros.slice(0,2)}/${numeros.slice(2,4)}/${numeros.slice(4)}`;
  }
  function lerDataBrasileira(valor){
    const numeros=valor.replace(/\D/g,'');
    if(numeros.length!==8)return null;
    const d=Number(numeros.slice(0,2)),mes=Number(numeros.slice(2,4)),a=Number(numeros.slice(4,8));
    const data=new Date(a,mes-1,d,12);
    return data.getFullYear()===a&&data.getMonth()===mes-1&&data.getDate()===d?data:null;
  }
  function adicionarDias(data,qtd){const r=new Date(data);r.setDate(r.getDate()+qtd);return r}
  function formatarData(data){return data.toLocaleDateString('pt-BR')}
  function calcularOffsets(){const o=[0];for(let i=1;i<etapas.length;i++)o[i]=o[i-1]+etapas[i].duracao;return o}
  function opcoesEtapas(indice=0){return etapas.map((e,i)=>`<option value="${i}" ${i===indice?'selected':''}>${i+1}. ${e.nome} (${e.duracao} dias)</option>`).join('')}

  function renderCalculadora(){
    main.innerHTML=`<section class="space-y-6"><div class="border-l-4 border-accent pl-3"><h2 class="text-2xl font-semibold text-gray-900">Calculadora de Prazos</h2><p class="text-sm text-gray-500 mt-1">Informe uma data de referência e a etapa correspondente.</p></div>
    <div class="grid grid-cols-1 xl:grid-cols-[minmax(300px,0.8fr)_minmax(520px,1.5fr)] gap-6 items-start">
      <form id="form-calculo" class="bg-white p-6 rounded-lg shadow-sm border border-gray-100 xl:sticky xl:top-8 space-y-5">
        <div><label for="dataInput" class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">Insira a data</label><input id="dataInput" value="${ultimoCalculo?.dataTexto||''}" placeholder="dd/mm/aaaa" inputmode="numeric" maxlength="10" autocomplete="off" class="${inputClass}" required></div>
        <div><label for="etapaSelecionada" class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">Etapa correspondente</label><select id="etapaSelecionada" class="${inputClass}">${opcoesEtapas(ultimoCalculo?.indice||0)}</select></div>
        <button class="w-full px-5 py-2.5 bg-accent hover:bg-accent-dark text-gray-900 font-bold rounded-md text-sm transition shadow-sm flex justify-center items-center gap-2"><i data-lucide="calculator" class="w-4 h-4"></i>Calcular</button>
        <div id="mensagem" class="text-sm font-semibold text-red-700" aria-live="polite"></div>
      </form>
      <section><div class="flex flex-wrap gap-4 mb-4 text-xs font-semibold text-gray-500"><span><b class="inline-block w-2.5 h-2.5 rounded-full bg-violet-600 mr-1"></b>Execução Interna</span><span><b class="inline-block w-2.5 h-2.5 rounded-full bg-[#00ADB5] mr-1"></b>Execução Externa</span><span><b class="inline-block w-2.5 h-2.5 rounded-full bg-amber-500 mr-1"></b>Execução Terceirizada</span></div><div id="timeline" class="space-y-3"></div></section>
    </div></section>`;
    const campoData=document.getElementById('dataInput');
    campoData.addEventListener('input',e=>{
      const inicio=e.target.selectionStart;
      const tamanhoAnterior=e.target.value.length;
      e.target.value=formatarEntradaData(e.target.value);
      const diferenca=e.target.value.length-tamanhoAnterior;
      const novaPosicao=Math.max(0,(inicio??e.target.value.length)+diferenca);
      e.target.setSelectionRange(novaPosicao,novaPosicao);
    });
    campoData.addEventListener('paste',e=>{
      e.preventDefault();
      campoData.value=formatarEntradaData(e.clipboardData.getData('text'));
      campoData.dispatchEvent(new Event('input',{bubbles:true}));
    });
    document.getElementById('form-calculo').addEventListener('submit',e=>{e.preventDefault();executarCalculo()});
    if(calculoRealizado) executarCalculo(true); else renderEtapasSemDatas();
    lucide.createIcons();
  }
  function renderEtapasSemDatas(){document.getElementById('timeline').innerHTML=etapas.map((e,i)=>cardEtapa(e,i,null,-1)).join('')}
  function cardEtapa(etapa,i,data,selecionado){const classes=['timeline-event','bg-white','p-4','rounded-lg','shadow-sm','border','border-gray-100'];if(i<7)classes.push('grupo-ecs');else classes.push('grupo-externo');if(i===3||i===5)classes.push('etapa-especial');if(i===selecionado)classes.push('selecionada');return `<article class="${classes.join(' ')}"><div class="flex items-start justify-between gap-4"><div><span class="text-xs font-bold text-gray-400 uppercase">Etapa ${i+1}</span><h3 class="text-sm text-gray-800 mt-1">${etapa.nome}</h3></div><div class="text-right shrink-0">${data?`<div class="font-bold text-gray-900">${formatarData(data)}</div>`:''}<div class="text-xs text-gray-500 mt-1">${etapa.duracao} dias</div></div></div></article>`}
  function executarCalculo(silencioso=false){const dataTexto=document.getElementById('dataInput').value, data=lerDataBrasileira(dataTexto), indice=Number(document.getElementById('etapaSelecionada').value), msg=document.getElementById('mensagem');msg.textContent='';if(!data){msg.textContent='Informe uma data válida no formato dd/mm/aaaa.';return}calculoRealizado=true;ultimoCalculo={dataTexto,indice};const offsets=calcularOffsets(),base=offsets[indice];document.getElementById('timeline').innerHTML=etapas.map((e,i)=>cardEtapa(e,i,adicionarDias(data,offsets[i]-base),indice)).join('');if(!silencioso)msg.textContent=''}

  function renderConfiguracoes(){main.innerHTML=`<section class="space-y-6"><div class="border-l-4 border-accent pl-3"><h2 class="text-2xl font-semibold text-gray-900">Configurações</h2><p class="text-sm text-gray-500 mt-1">Altere a duração das etapas e aplique os valores ao cálculo já realizado.</p></div>
    <div class="bg-white rounded-lg shadow-sm border border-gray-100 overflow-hidden"><div class="p-5 bg-gray-50 border-b border-gray-200 flex items-center justify-between gap-4"><div><h3 class="font-semibold text-gray-800">Duração das etapas</h3><p class="text-xs text-gray-500 mt-1">Valores em dias corridos.</p></div><span class="text-xs font-bold text-gray-400">19 ETAPAS</span></div>
    <div class="divide-y divide-gray-100">${etapas.map((e,i)=>`<div class="p-4 grid grid-cols-[minmax(0,1fr)_100px] gap-4 items-center"><label for="duracao-${i}" class="text-sm text-gray-700"><b class="text-gray-400 mr-2">${i+1}.</b>${e.nome}</label><div><label class="sr-only" for="duracao-${i}">Duração da etapa ${i+1}</label><input id="duracao-${i}" type="number" min="0" step="1" value="${e.duracao}" class="${inputClass} text-right" aria-label="Duração da etapa ${i+1}"></div></div>`).join('')}</div>
    <div class="p-5 bg-gray-50 border-t border-gray-200 flex flex-col sm:flex-row sm:items-center justify-between gap-3"><p id="config-mensagem" class="text-sm ${calculoRealizado?'text-gray-500':'text-amber-700'}">${calculoRealizado?'As alterações recalcularão automaticamente as datas.':'Realize primeiro um cálculo na tela Calculadora.'}</p><button id="aplicar" ${calculoRealizado?'':'disabled'} class="px-5 py-2.5 bg-accent hover:bg-accent-dark disabled:bg-gray-200 disabled:text-gray-400 disabled:cursor-not-allowed text-gray-900 font-bold rounded-md text-sm transition shadow-sm">Aplicar alterações</button></div></div></section>`;
    document.getElementById('aplicar').addEventListener('click',aplicarAlteracoes);lucide.createIcons();
  }
  function aplicarAlteracoes(){const msg=document.getElementById('config-mensagem'),novos=etapas.map((_,i)=>Number(document.getElementById(`duracao-${i}`).value));if(novos.some(v=>!Number.isInteger(v)||v<0)){msg.className='text-sm text-red-700 font-semibold';msg.textContent='Informe durações válidas, em números inteiros iguais ou maiores que zero.';return}novos.forEach((v,i)=>etapas[i].duracao=v);msg.className='text-sm text-green-700 font-semibold';msg.textContent='Alterações aplicadas. As datas da Calculadora foram recalculadas.';setTimeout(()=>navigateTo('calculadora'),650)}

  function updateNav(){document.querySelectorAll('.nav-link').forEach(b=>{const ativo=b.dataset.view===activeView;b.className=`nav-link w-full flex items-center gap-3 px-3 py-2 rounded-md text-sm font-semibold transition ${ativo?'bg-accent text-gray-900 shadow-sm':'text-gray-600 hover:bg-gray-100 hover:text-gray-900'}`})}
  function navigateTo(view){activeView=view;main.classList.remove('animate-fade-in');void main.offsetWidth;main.classList.add('animate-fade-in');view==='configuracoes'?renderConfiguracoes():renderCalculadora();updateNav();if(innerWidth<768)sidebar.classList.add('-translate-x-full')}
  document.querySelectorAll('.nav-link').forEach(b=>b.addEventListener('click',()=>navigateTo(b.dataset.view)));
  document.getElementById('open-sidebar-btn').addEventListener('click',()=>sidebar.classList.remove('-translate-x-full'));
  document.getElementById('close-sidebar-btn').addEventListener('click',()=>sidebar.classList.add('-translate-x-full'));
  navigateTo('calculadora');
});
</script>
</body>
</html>
